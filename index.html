<!DOCTYPE html>
<html lang="en" class=""><head><script>window.livecodes = window.livecodes || {};</script><title>Untitled Project</title><meta name="title" content="Untitled Project"><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="./style.css"><script src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js" async=""></script><script type="importmap">{
  "imports": {}
}</script></head><body><div class="terminal-container">
  <div class="cash-stat">
    &gt;&gt; TOTAL_PROFIT_FROM_SALT: <span id="cashCounter">$0.00</span>

  <header>
    <h1>SYSTEM_LOG: <span class="neon-pink-text">HATER_ARCHIVE_2026</span></h1>
    <p class="blink">SYSTEM ACTIVE: WAITING FOR INPUT...</p>
  </header>

  <section class="cmd-area">
    <div class="input-line">
      <span class="prompt">NAME_ID:</span>
      <input type="text" id="haterName" spellcheck="false" autocomplete="off">
    </div>
    <div class="input-line">
      <span class="prompt">GRIEVANCE:</span>
      <input type="text" id="haterReason" spellcheck="false" autocomplete="off">
    </div>
    <button onclick="logHater()" class="btn-submit">EXECUTE_DEPOSIT</button>
  </section>

  <div class="crt-screen">
    <div class="scanline"></div>
    <ul id="haterList">
      <li>[!] STANDBY: LOGGING PROTOCOLS INITIALIZED...</li>
    </ul>
  </div>

  <div class="share-box">
    <button onclick="shareFB()" class="btn-fb">SEND_TO_FACEBOOK</button>
  </div>
</div>
<script src="./script.js"></script></body></html>
